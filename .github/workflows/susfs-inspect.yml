name: susfs-inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find the four missing symbols
        shell: bash
        run: |
          set +e +o pipefail
          git clone --quiet https://github.com/KernelSU-Next/KernelSU-Next ~/k
          cd ~/k && git checkout -q v3.4.0-legacy
          git clone --quiet --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/s
          {
            echo "## In KernelSU-Next v3.4.0-legacy driver source"
            echo '```'
            grep -rn "ksu_try_umount\|susfs_is_current_ksu_domain\|susfs_is_current_zygote_domain\|susfs_try_umount_all" ~/k/kernel | head -40
            echo '```'
            echo "## In the susfs4ksu patch set (any file)"
            echo '```'
            grep -rln "ksu_try_umount\b" ~/s/kernel_patches
            grep -n "^+.*\(ksu_try_umount\|susfs_is_current_ksu_domain\|susfs_is_current_zygote_domain\|susfs_try_umount_all\)" ~/s/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
