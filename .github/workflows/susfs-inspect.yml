name: susfs-inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check core_hook.c piece in isolation
        shell: bash
        run: |
          set +e +o pipefail
          git clone --quiet https://github.com/KernelSU-Next/KernelSU-Next ~/k
          cd ~/k && git checkout -q v3.4.0-legacy
          git clone --quiet --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/s
          P=~/s/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          # Extract just the core_hook.c hunk into its own patch file
          awk '/^diff --git a\/kernel\/core_hook.c/{p=1} /^diff --git/ && !/core_hook.c/{p=0} p' "$P" > /tmp/core.patch
          wc -l /tmp/core.patch
          patch -p1 -F3 --no-backup-if-mismatch --dry-run < /tmp/core.patch > ~/out.log 2>&1
          {
            echo "## core_hook.c patch, dry run"
            echo '```'
            cat ~/out.log | head -60
            echo '```'
            echo "## Current ksu_try_umount / zygote / ksu_domain presence in core_hook.c"
            echo '```'
            grep -n "ksu_try_umount\|is_zygote\|is_ksu_domain\|_domain(" kernel/core_hook.c | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
