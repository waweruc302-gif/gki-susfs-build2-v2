name: susfs-inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Full dump - everything needed in one shot
        shell: bash
        run: |
          set +e +o pipefail
          git clone --quiet https://github.com/KernelSU-Next/KernelSU-Next ~/k
          cd ~/k && git checkout -q v3.4.0-legacy
          git clone --quiet --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/s
          P=~/s/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          {
            echo "## 1. Full kernel/ file tree"
            echo '```'
            find kernel -name '*.c' -o -name '*.h' | sort
            echo '```'

            echo "## 2. Functions the 4 missing symbols need, searched everywhere"
            echo '```'
            grep -rln "ksu_try_umount\|try_umount\|is_zygote\|is_ksu_domain\|is_manager\|susfs_is_current" kernel
            echo '```'

            echo "## 3. sys_reboot/supercall entry point (known working hook)"
            echo '```'
            cat kernel/supercall/supercall.c 2>/dev/null | head -100
            echo '```'

            echo "## 4. Every file the patch touches, and whether it exists here"
            echo '```'
            for f in $(grep '^diff --git a/' "$P" | sed 's|diff --git a/||; s| b/.*||'); do
              if [ -f "$f" ]; then echo "EXISTS: $f"; else echo "MISSING: $f"; fi
            done
            echo '```'

            echo "## 5. Dry-run patch per existing file only"
            echo '```'
            for f in $(grep '^diff --git a/' "$P" | sed 's|diff --git a/||; s| b/.*||'); do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                awk -v file="$f" '
                  $0 ~ "^diff --git a/" file" " {p=1; print; next}
                  /^diff --git/ {p=0}
                  p' "$P" > /tmp/one.patch
                patch -p1 -F3 --dry-run --no-backup-if-mismatch < /tmp/one.patch 2>&1 | grep -E "Hunk|FAILED|succeeded|out of"
              fi
            done
            echo '```'

            echo "## 6. setuid_hook.c and lsm_hooks.c full content (small files, likely relevant)"
            echo '```c'
            cat kernel/hook/setuid_hook.c 2>/dev/null
            echo '--- lsm_hooks.c ---'
            cat kernel/hook/lsm_hooks.c 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
