name: build-kernel
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = show the failing hunks of the SUSFS patch; scan = rank all tags; build = full kernel build"
        type: choice
        default: inspect
        options:
          - inspect
          - scan
          - build
      ksu_repo:
        description: "KernelSU repo URL"
        default: "https://github.com/KernelSU-Next/KernelSU-Next"
      ksu_branch:
        description: "Branch/tag/commit"
        default: "v0.9.5"
jobs:
  inspect:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Show failing hunks of the SUSFS patch
        shell: bash
        env:
          IN_REPO: ${{ inputs.ksu_repo }}
          IN_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          set +e +o pipefail
          git clone --quiet --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu
          git clone --quiet "$IN_REPO" ~/ksu
          cd ~/ksu
          git checkout -q "$IN_BRANCH" || echo "CHECKOUT FAILED for $IN_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          P=~/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          {
            echo "## Source"
            echo '```'; git describe --tags --always; git log -1 --oneline; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 1) strict apply with reject files (no pipe, so it is not killed)
          git apply --reject --whitespace=fix "$P" > ~/apply.txt 2>&1
          {
            echo "## git apply --reject (filtered)"
            echo '```'
            grep -E '^(Checking|Applied|Applying|Hunk|Rejected|error: patch failed|error: .*(does not apply|No such file))' ~/apply.txt | head -60
            echo '```'
            echo "## Failed hunks (.rej files)"
            for f in $(find . -name '*.rej'); do
              echo "### $f"
              echo '```diff'
              head -120 "$f"
              echo '```'
            done
            echo "## Where the failing code lives in core_hook.c"
            echo '```'
            grep -n "escape_to_root\|disable_seccomp\|setup_selinux\|ksu_handle_rename\|ksu_handle_setuid\|#endif" kernel/core_hook.c | head -60
            echo '```'
            echo "## core_hook.c lines 90-290"
            echo '```'
            sed -n '90,290p' kernel/core_hook.c | cat -n | sed 's/^ *\([0-9]*\)/\1+89/'
            echo '```'
            echo "## The patch's own core_hook.c section"
            echo '```diff'
            awk '/^diff --git a\/kernel\/core_hook.c/{p=1;print;next} /^diff --git/{p=0} p' "$P" | head -220
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 2) fuzzy apply test on a clean tree
          git checkout -q -f . ; git clean -fdq
          patch -p1 -F3 --no-backup-if-mismatch < "$P" > ~/fuzz.txt 2>&1
          {
            echo "## Fuzzy apply test (patch -F3)"
            echo '```'
            grep -E "^(patching file|Hunk|[0-9]+ out of)|FAILED|fuzz|offset" ~/fuzz.txt | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    if: inputs.mode == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan KernelSU repos for the SUSFS patch
        shell: bash
        run: |
          set +e +o pipefail
          git clone --quiet --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu
          P=~/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          for repo in KernelSU-Next/KernelSU-Next tiann/KernelSU; do
            rm -rf ~/ksu
            git clone --quiet "https://github.com/$repo" ~/ksu || continue
            cd ~/ksu
            : > ~/res.txt
            for ref in $(git tag) $(git branch -r | grep -v HEAD | sed 's|origin/||'); do
              git checkout -q -f "$ref" 2>/dev/null || continue
              out=$(git apply --check "$P" 2>&1)
              fails=$(echo "$out" | grep -c "patch failed\|No such file")
              core=no; [ -f kernel/core_hook.c ] && core=yes
              echo "$fails  $ref  core_hook.c=$core" >> ~/res.txt
            done
            {
              echo "## $repo (failed hunks, lower is better, 0 = patch applies)"
              echo '```'
              sort -n ~/res.txt | head -25
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cd ~
          done

  build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / /mnt; free -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core flex bison build-essential zip curl libssl-dev bc python3 rsync cpio lz4 libncurses-dev
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod +x ~/repo
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global color.ui false

      - name: Sync AOSP kernel tree
        run: |
          mkdir -p ~/gki && cd ~/gki
          ~/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4 --depth=1
          ~/repo sync -c --no-tags --no-clone-bundle -j4

      - name: Pin kernel tag, get KernelSU, apply SUSFS patches
        shell: bash
        env:
          IN_REPO: ${{ inputs.ksu_repo }}
          IN_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu

          cd ~/gki/common
          R=$(git remote | head -1)
          git fetch --depth=1 "$R" tag android12-5.4.254_r00
          git checkout -f tags/android12-5.4.254_r00

          rm -rf KernelSU
          git clone --quiet "$IN_REPO" KernelSU
          (cd KernelSU && git checkout --quiet "$IN_BRANCH")
          if grep -q "SUSFS" KernelSU/kernel/Kconfig; then
            echo ">>> $IN_REPO $IN_BRANCH already has SUSFS"
          else
            cp ~/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
            if (cd KernelSU && git apply --check 10_enable_susfs_for_ksu.patch); then
              (cd KernelSU && git apply --whitespace=fix 10_enable_susfs_for_ksu.patch)
              echo ">>> $IN_REPO $IN_BRANCH accepted the SUSFS patch"
            else
              echo "FAILED: SUSFS patch does not apply to $IN_REPO $IN_BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          (cd KernelSU && git rev-parse HEAD && git remote get-url origin && git describe --tags --always) | tee ~/gki/ksu_commit.txt
          grep -n "SUSFS" KernelSU/kernel/Kconfig | head -20

          cp ~/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .
          git apply --reject --whitespace=fix 50_add_susfs_in_kernel-5.4.patch
          find . -name "*.rej" -not -path "./KernelSU/*" -exec echo {} \; -exec cat {} \;

          cp "$GITHUB_WORKSPACE/scmversion.txt" ~/gki/common/.scmversion
          cat ~/gki/common/.scmversion; echo

      - name: Hook KernelSU and SUSFS into the tree
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki/common
          cp -rnv ~/susfs4ksu/kernel_patches/fs/. fs/ || true
          cp -rnv ~/susfs4ksu/kernel_patches/include/linux/. include/linux/ || true
          ls -l fs/susfs.c include/linux/susfs.h
          ln -sfn ../KernelSU/kernel drivers/kernelsu

          grep -rl "linux/pgtable.h" KernelSU/kernel | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g'
          grep -rl "linux/minmax.h" KernelSU/kernel | xargs -r sed -i 's|<linux/minmax.h>|<linux/kernel.h>|g'
          if ! grep -rq "strncpy_from_user_nofault" include/linux/; then
            grep -rl "strncpy_from_user_nofault" KernelSU/kernel | xargs -r sed -i 's/strncpy_from_user_nofault/strncpy_from_unsafe_user/g'
          fi

          echo "--- headers KernelSU wants that this tree may lack ---"
          for h in $(grep -rhoE '#include <(linux|asm)/[^>]+>' KernelSU/kernel | sed -E 's/#include <(.*)>/\1/' | sort -u); do
            if [ ! -e "include/$h" ] && [ ! -e "arch/arm64/include/$h" ] && [ ! -e "include/uapi/$h" ] && [ ! -e "arch/arm64/include/uapi/$h" ]; then echo "MISSING HEADER: $h"; fi
          done || true

          grep -q 'CONFIG_KSU' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          ls -l drivers/kernelsu/Kconfig drivers/kernelsu/Makefile
          grep -n "SUSFS" drivers/kernelsu/Kconfig || echo "WARNING: no SUSFS option in KernelSU Kconfig"
          printf '%s\n' 'CONFIG_KSU=y' 'CONFIG_KSU_SUSFS=y' 'CONFIG_KPROBES=y' 'CONFIG_HAVE_KPROBES=y' 'CONFIG_KPROBE_EVENTS=y' >> arch/arm64/configs/gki_defconfig
          printf '%s\n' '. ${ROOT_DIR}/common/build.config.gki.aarch64' 'POST_DEFCONFIG_CMDS=""' > build.config.ksu

      - name: Build (keep going to collect every error)
        shell: bash
        run: |
          set +e +o pipefail
          cd ~/gki
          SKIP_MRPROPER=1 MAKE_ARGS="-k" BUILD_CONFIG=common/build.config.ksu ./build/build.sh 2>&1 | tee ~/build.log
          if [ -f out/android12-5.4/dist/Image ]; then
            echo "Image built"
            exit 0
          fi
          echo "NO IMAGE PRODUCED"
          exit 1

      - name: Check version string and KernelSU
        shell: bash
        run: |
          set -euo pipefail
          test -f ~/gki/out/android12-5.4/dist/Image
          grep -E "CONFIG_KSU|CONFIG_KPROBES=" ~/gki/out/android12-5.4/common/.config || true
          strings ~/gki/out/android12-5.4/dist/Image > /tmp/s.txt
          grep -m1 "^Linux version 5" /tmp/s.txt
          grep -m1 "^Linux version 5" /tmp/s.txt | grep -q -- '-ab603 ('
          grep -q "^CONFIG_KSU=y" ~/gki/out/android12-5.4/common/.config
          grep -q "^CONFIG_KSU_SUSFS=y" ~/gki/out/android12-5.4/common/.config
          grep -q "ksud" /tmp/s.txt

      - name: Summary of errors
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          {
            echo "## KernelSU source"
            echo '```'; cat ~/gki/ksu_commit.txt 2>/dev/null || echo "not reached"; echo '```'
            echo "## Compiler errors (unique)"
            echo '```'
            if [ -f ~/build.log ]; then
              grep -E "error:|fatal error|undefined (reference|symbol)" ~/build.log | sed 's|/home/runner/gki/common/||' | sort -u | head -80
            else
              echo "no build.log (build step did not run)"
            fi
            echo '```'
            echo "## Make targets that failed"
            echo '```'
            [ -f ~/build.log ] && grep -E "\*\*\* \[.*\] Error" ~/build.log | sort -u | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-dist
          path: |
            /home/runner/gki/out/android12-5.4/dist
            /home/runner/build.log
            /home/runner/gki/ksu_commit.txt
