name: build-kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / /mnt; free -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core flex bison build-essential zip curl libssl-dev bc python3 rsync cpio lz4 libncurses-dev
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod +x ~/repo
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global color.ui false

      - name: Sync AOSP kernel tree
        run: |
          mkdir -p ~/gki && cd ~/gki
          ~/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4 --depth=1
          ~/repo sync -c --no-tags --no-clone-bundle -j4

      - name: Pin kernel tag, pick KernelSU-Next with SUSFS, patch kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu
          ls ~/susfs4ksu/kernel_patches/ ~/susfs4ksu/kernel_patches/KernelSU/

          cd ~/gki/common
          R=$(git remote | head -1)
          git fetch --depth=1 "$R" tag android12-5.4.254_r00
          git checkout -f tags/android12-5.4.254_r00

          pick_ksu() {
            rm -rf KernelSU
            git clone --quiet "$1" KernelSU || return 1
            (cd KernelSU && git checkout --quiet "$2") || return 1
            if grep -q "SUSFS" KernelSU/kernel/Kconfig; then
              echo ">>> $1 $2 already has SUSFS"; return 0
            fi
            cp ~/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
            if (cd KernelSU && git apply --check 10_enable_susfs_for_ksu.patch); then
              (cd KernelSU && git apply --whitespace=fix 10_enable_susfs_for_ksu.patch)
              echo ">>> $1 $2 accepted the SUSFS patch"; return 0
            fi
            echo ">>> $1 $2: no usable SUSFS path"; return 1
          }

          pick_ksu https://github.com/KernelSU-Next/KernelSU-Next legacy \
            || pick_ksu https://github.com/pershoot/KernelSU-Next dev-susfs \
            || { echo "NO KERNELSU SOURCE WORKED"; exit 1; }

          (cd KernelSU && git rev-parse HEAD && git remote get-url origin && git branch --show-current) | tee ~/gki/ksu_commit.txt
          grep -n "SUSFS" KernelSU/kernel/Kconfig | head -20

          cp ~/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .
          git apply --reject --whitespace=fix 50_add_susfs_in_kernel-5.4.patch
          find . -name "*.rej" -not -path "./KernelSU/*" -exec echo {} \; -exec cat {} \;

          cp "$GITHUB_WORKSPACE/scmversion.txt" ~/gki/common/.scmversion
          cat ~/gki/common/.scmversion; echo

      - name: Hook KernelSU-Next and SUSFS into the tree
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki/common

          if [ -d ~/susfs4ksu/kernel_patches/fs ]; then
            cp
