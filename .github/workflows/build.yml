name: build-kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / /mnt; free -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core flex bison build-essential zip curl libssl-dev bc python3 rsync cpio lz4 libncurses-dev
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod +x ~/repo
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global color.ui false

      - name: Sync AOSP kernel tree
        run: |
          mkdir -p ~/gki && cd ~/gki
          ~/repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4 --depth=1
          ~/repo sync -c --no-tags --no-clone-bundle -j4

      - name: Pin kernel tag, pick KernelSU-Next with SUSFS, patch kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu
          ls ~/susfs4ksu/kernel_patches/ ~/susfs4ksu/kernel_patches/KernelSU/

          cd ~/gki/common
          R=$(git remote | head -1)
          git fetch --depth=1 "$R" tag android12-5.4.254_r00
          git checkout -f tags/android12-5.4.254_r00

          pick_ksu() {
            rm -rf KernelSU
            git clone --quiet "$1" KernelSU || return 1
            (cd KernelSU && git checkout --quiet "$2") || return 1
            if grep -q "SUSFS" KernelSU/kernel/Kconfig; then
              echo ">>> $1 $2 already has SUSFS"; return 0
            fi
            cp ~/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
            if (cd KernelSU && git apply --check 10_enable_susfs_for_ksu.patch); then
              (cd KernelSU && git apply --whitespace=fix 10_enable_susfs_for_ksu.patch)
              echo ">>> $1 $2 accepted the SUSFS patch"; return 0
            fi
            echo ">>> $1 $2: no usable SUSFS path"; return 1
          }

          pick_ksu https://github.com/KernelSU-Next/KernelSU-Next legacy \
            || pick_ksu https://github.com/pershoot/KernelSU-Next dev-susfs \
            || { echo "NO KERNELSU SOURCE WORKED"; exit 1; }

          (cd KernelSU && git rev-parse HEAD && git remote get-url origin && git branch --show-current) | tee ~/gki/ksu_commit.txt
          grep -n "SUSFS" KernelSU/kernel/Kconfig | head -20

          cp ~/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .
          git apply --reject --whitespace=fix 50_add_susfs_in_kernel-5.4.patch
          find . -name "*.rej" -not -path "./KernelSU/*" -exec echo {} \; -exec cat {} \;

          cp "$GITHUB_WORKSPACE/scmversion.txt" ~/gki/common/.scmversion
          cat ~/gki/common/.scmversion; echo

      - name: Hook KernelSU-Next and SUSFS into the tree
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki/common
          cp -rnv ~/susfs4ksu/kernel_patches/fs/. fs/ || true
          cp -rnv ~/susfs4ksu/kernel_patches/include/linux/. include/linux/ || true
          ls -l fs/susfs.c include/linux/susfs.h
          ln -sfn ../KernelSU/kernel drivers/kernelsu

          # --- 5.4 compatibility swaps ---
          grep -rl "linux/pgtable.h" KernelSU/kernel | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g'
          grep -rl "linux/minmax.h" KernelSU/kernel | xargs -r sed -i 's|<linux/minmax.h>|<linux/kernel.h>|g'
          # strncpy_from_user_nofault was added in 5.8; 5.4 calls it strncpy_from_unsafe_user
          if ! grep -rq "strncpy_from_user_nofault" include/linux/; then
            grep -rl "strncpy_from_user_nofault" KernelSU/kernel | xargs -r sed -i 's/strncpy_from_user_nofault/strncpy_from_unsafe_user/g'
          fi
          echo "--- compat includes now ---"
          grep -rn "pgtable.h\|minmax.h" KernelSU/kernel || true

          echo "--- headers KernelSU wants that this tree may lack ---"
          for h in $(grep -rhoE '#include <(linux|asm)/[^>]+>' KernelSU/kernel | sed -E 's/#include <(.*)>/\1/' | sort -u); do
            if [ ! -e "include/$h" ] && [ ! -e "arch/arm64/include/$h" ] && [ ! -e "include/uapi/$h" ] && [ ! -e "arch/arm64/include/uapi/$h" ]; then echo "MISSING HEADER: $h"; fi
          done || true

          grep -q 'CONFIG_KSU' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          tail -3 drivers/Makefile
          tail -3 drivers/Kconfig
          ls -l drivers/kernelsu/Kconfig drivers/kernelsu/Makefile
          grep -n "SUSFS" drivers/kernelsu/Kconfig || echo "WARNING: no SUSFS option in KernelSU Kconfig"
          printf '%s\n' 'CONFIG_KSU=y' 'CONFIG_KSU_SUSFS=y' 'CONFIG_KPROBES=y' 'CONFIG_HAVE_KPROBES=y' 'CONFIG_KPROBE_EVENTS=y' >> arch/arm64/configs/gki_defconfig
          tail -8 arch/arm64/configs/gki_defconfig
          printf '%s\n' '. ${ROOT_DIR}/common/build.config.gki.aarch64' 'POST_DEFCONFIG_CMDS=""' > build.config.ksu
          cat build.config.ksu

      - name: Diagnose SUSFS API mismatch
        shell: bash
        run: |
          cd ~/gki/common
          grep -rhoE 'susfs_[a-z_0-9]+' KernelSU/kernel | sort -u > /tmp/drv.txt || true
          grep -hoE 'susfs_[a-z_0-9]+' include/linux/susfs.h | sort -u > /tmp/hdr.txt || true
          echo "--- driver calls, NOT declared in kernel header ---"
          comm -23 /tmp/drv.txt /tmp/hdr.txt || true
          echo "--- susfs calls in sucompat.c ---"
          grep -n "susfs_" KernelSU/kernel/feature/sucompat.c | head -30 || true
          echo "--- no_su anywhere in susfs4ksu ---"
          grep -rn "no_su" ~/susfs4ksu --include=*.patch --include=*.h --include=*.c | head -20 || true
          echo "--- susfs versions ---"
          grep -rn "SUSFS_VERSION" KernelSU/kernel/Makefile include/linux/susfs.h | head || true
          echo "--- susfs4ksu remote branches ---"
          git -C ~/susfs4ksu ls-remote --heads origin || true
          exit 0

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd ~/gki
          SKIP_MRPROPER=1 BUILD_CONFIG=common/build.config.ksu ./build/build.sh 2>&1 | tee ~/build.log
          test -f out/android12-5.4/dist/Image

      - name: Check version string and KernelSU
        shell: bash
        run: |
          set -euo pipefail
          test -f ~/gki/out/android12-5.4/dist/Image
          grep -E "CONFIG_KSU|CONFIG_KPROBES=" ~/gki/out/android12-5.4/common/.config || true
          strings ~/gki/out/android12-5.4/dist/Image > /tmp/s.txt
          grep -m1 "^Linux version 5" /tmp/s.txt
          grep -m1 "^Linux version 5" /tmp/s.txt | grep -q -- '-ab603 ('
          grep -q "^CONFIG_KSU=y" ~/gki/out/android12-5.4/common/.config
          grep -q "^CONFIG_KSU_SUSFS=y" ~/gki/out/android12-5.4/common/.config
          grep -q "ksud" /tmp/s.txt

      - name: List undefined symbols
        if: failure()
        shell: bash
        run: |
          if [ -f ~/build.log ]; then
            grep -E "undefined (reference|symbol)" ~/build.log | sort -u || true
            echo "--- compiler errors ---"
            grep -E "error:|fatal error" ~/build.log | head -20 || true
          else
            echo "no build.log (Build step did not run)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-dist
          path: |
            /home/runner/gki/out/android12-5.4/dist
            /home/runner/build.log
            /home/runner/gki/ksu_commit.txt
