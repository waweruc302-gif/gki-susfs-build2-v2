name: susfs-tool
on: workflow_dispatch
jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Build ksu_susfs v1.5.5 userspace tool
        shell: bash
        run: |
          set +e +o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          git clone --quiet --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git ~/s
          cd ~/s
          D=$(dirname "$(find ksu_susfs -name main.c | head -1)")
          mkdir -p ~/stub/android
          cat > ~/stub/android/log.h << 'EOF'
          #include <stdio.h>
          #define ANDROID_LOG_INFO 4
          #define ANDROID_LOG_ERROR 6
          #define __android_log_print(p, t, ...) fprintf(stderr, __VA_ARGS__)
          EOF
          cd "$D"
          aarch64-linux-gnu-gcc -static -O2 -include limits.h -I ~/stub -I . \
            -Dst_atime_nsec=st_atim.tv_nsec -Dst_mtime_nsec=st_mtim.tv_nsec -Dst_ctime_nsec=st_ctim.tv_nsec \
            -Dst_atimensec=st_atim.tv_nsec -Dst_mtimensec=st_mtim.tv_nsec -Dst_ctimensec=st_ctim.tv_nsec \
            -o ~/ksu_susfs_arm64 main.c > ~/cc.log 2>&1
          {
            echo "## Compile result"
            echo '```'
            grep -E "error|undefined" ~/cc.log | head -30
            ls -l ~/ksu_susfs_arm64 2>&1
            file ~/ksu_susfs_arm64 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f ~/ksu_susfs_arm64 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ksu_susfs_arm64
          path: /home/runner/ksu_susfs_arm64
